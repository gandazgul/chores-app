name: Verify Android app
on:
  pull_request:
    paths: ["mobile/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test test_driver
      - run: flutter analyze
      - run: flutter test
      # No production Firebase configuration or signing credentials in CI.
      - run: flutter build apk --debug
