name: Verify and Publish Container Image

on:
  pull_request:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_ENV: test
      ENABLE_NOTIFICATIONS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - run: deno install --frozen
      - run: deno task ci
      # Playwright's browser archive extraction hangs under Deno on a fresh runner.
      # Use Node only for the installer; application and tests still run on Deno.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium
        timeout-minutes: 5
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: deno task test:e2e
        env:
          DB_PATH: /tmp/tow-e2e.db
          E2E_PORT: "18080"
      - run: deno task test:production-lifecycle
        env:
          DOCKER_CLI: podman

  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long
      - name: Build and publish verified image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | podman login ghcr.io --username "$REGISTRY_USER" --password-stdin
          podman build --file Containerfile --tag tow-release .
          while IFS= read -r image; do
            podman tag tow-release "$image"
            podman push "$image"
          done <<< "$IMAGE_TAGS"
